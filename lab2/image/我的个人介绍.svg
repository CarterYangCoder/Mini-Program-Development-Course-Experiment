  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071a33"/>
      <stop offset="45%" stop-color="#0d2b55"/>
      <stop offset="100%" stop-color="#08203f"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
